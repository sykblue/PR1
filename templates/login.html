{% extends "account-base.html" %}
{% block title %}로그인{% endblock %}
{% block heading %}로그인{% endblock %}
{% block description %}내 관찰 리포트와 학습 데이터를<br>이어서 관리하세요.{% endblock %}
{% block form %}
<form id="account-form" class="auth-form" data-mode="login" data-next="{{ return_to }}" action="/api/auth/login" method="post">
  <div class="auth-fields-scroll" tabindex="0" role="region" aria-label="계정 입력 항목">
  <div class="auth-field"><label for="account-username">아이디</label><input id="account-username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="24" placeholder="아이디를 입력해 주세요" required></div>
  <div class="auth-field"><label for="account-password">비밀번호</label><input id="account-password" name="password" type="password" autocomplete="current-password" maxlength="128" placeholder="비밀번호를 입력해 주세요" required></div>
  </div>
  <p id="account-message" class="auth-message" role="status" aria-live="polite" hidden></p>
  <button id="account-submit" class="button primary" type="submit" disabled>로그인</button>
</form>
{% endblock %}
{% block switch %}아직 계정이 없으신가요? <a href="{{ switch_url }}">회원가입</a>{% endblock %}
