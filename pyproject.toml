[project]
name = "hairline-lab"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "Flask>=3.1,<4",
    "Pillow>=11,<13",
    "numpy>=2.0,<3",
    "opencv-contrib-python-headless>=4.10,<6",
    "mediapipe>=0.10.21,<0.11",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
    "waitress>=3.0,<4",
    "websockets>=17.3,<18",
]

# Vercel installs from this file. Its Linux runtime has no libGL, so the GUI OpenCV that
# mediapipe asks for is swapped for the headless build. Local setup still uses requirements.txt.
[tool.uv]
override-dependencies = ["opencv-contrib-python; sys_platform == 'never'"]
